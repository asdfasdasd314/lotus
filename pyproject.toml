[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "community-intelligence-engine"
version = "0.1.0"
description = "Bounded discovery of related Reddit communities"
requires-python = ">=3.11"
dependencies = [
  "praw>=7.8,<8",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
